<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitleTag">Paper Grain Lab — SVGフィルターによる紙質感シミュレーター</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top">
  <div class="head-row">
    <div class="head-text">
      <h1>Paper Grain Lab</h1>
      <p id="pageIntro" data-i18n="pageIntro" data-i18n-html="1"></p>
    </div>
    <div class="lang-switch" role="group" aria-label="Language / 言語">
      <button type="button" class="lang-btn" data-lang="ja">
        <svg class="flag-icon" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="30" height="20" fill="#ffffff"/>
          <circle cx="15" cy="10" r="6" fill="#bc002d"/>
        </svg>
        <span>日本語</span>
      </button>
      <button type="button" class="lang-btn" data-lang="en">
        <svg class="flag-icon" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="60" height="30" fill="#00247d"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2"/>
          <path d="M30,0 V30 M0,15 H60" stroke="#ffffff" stroke-width="10"/>
          <path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6"/>
        </svg>
        <span>English</span>
      </button>
    </div>
  </div>
</header>

<div class="workspace">
  <!-- ============== PANE 1: original presets ============== -->
  <div class="pane-rail">
    <details class="section" open>
      <summary><span class="sec-title-row"><span data-i18n="originalsTitle"></span></span></summary>
      <div class="body">
        <p class="desc" data-i18n="originalsDesc"></p>
        <div id="originalList"></div>
      </div>
    </details>
  </div>

  <!-- ============== PANE 2: detail parameters ============== -->
  <div class="pane-params" id="paramsRail">
  </div>

  <!-- ============== PANE 3: live preview + SVG source ============== -->
  <div class="pane-preview">
    <div class="preview-card">
      <div class="preview-top">
        <div class="swatch-wrap" id="swatchWrap"></div>
        <div class="preview-meta">
          <span class="tag" id="metaTag">preset</span>
          <h3 id="metaName"></h3>
          <div id="metaBody"></div>
        </div>
      </div>
    </div>

    <div class="code-card">
      <div class="code-head">
        <span data-i18n="codeHeadLabel"></span>
        <button id="copyBtn" data-i18n="copyBtn"></button>
      </div>
      <pre class="code" id="codeOut"></pre>
    </div>
  </div>
</div>

<footer class="note" id="footerNote" data-i18n="footerNote" data-i18n-html="1"></footer>

<script src="js/app.js"></script>
</body>
</html>
